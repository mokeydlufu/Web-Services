spring.application.name=ofertas-service
server.port=${PORT:8082}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_empleabilidad?currentSchema=schema_ofertas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=schema_ofertas
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# JWT Secret
jwt.secret=${JWT_SECRET}

# Seguridad JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8081/realms/empleabilidad}

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Integracion Jooble Empleos Externos
jooble.api.key=${JOOBLE_API_KEY:}

# Cargar variables del archivo .env en la raiz
spring.config.import=optional:file:../../.env[.properties]
