springdoc.api-docs.path=/v3/api-docs
# Integracion Jooble Empleos Externos
jooble.api.key=${JOOBLE_API_KEY:03ea94dd-384a-4509-bab8-208bba450403}

# Cargar variables del archivo .env en la raiz
