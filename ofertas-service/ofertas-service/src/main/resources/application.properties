spring.application.name=ofertas-service
server.port=${PORT:8082}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-orange-snow-b599ngwh-pooler.c-7.us-east-2.aws.neon.tech:5432/db_empleapro?sslmode=require&currentSchema=public}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_xctadB5wTQ0K}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=public
