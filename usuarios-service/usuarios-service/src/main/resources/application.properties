spring.application.name=usuarios-service

server.port=${PORT:8081}

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_empleabilidad?currentSchema=schema_usuarios}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=schema_usuarios
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# JWT Secret
jwt.secret=${JWT_SECRET}

storage.local.base-path=${STORAGE_LOCAL_BASE_PATH:${java.io.tmpdir}}
storage.cv.max-size-mb=${STORAGE_CV_MAX_SIZE_MB:5}

# PeruAPI - Configuracion para consultas DNI/RUC
apisperu.token=${APISPERU_TOKEN:}
apiperu.token=${APISPERU_TOKEN:}
apisperu.dni-url=${APISPERU_DNI_URL:https://peruapi.com/api/dni}
apisperu.ruc-url=${APISPERU_RUC_URL:https://peruapi.com/api/ruc}

# Cargar variables opcionales de .env en la raiz y local
spring.config.import=optional:file:../../.env[.properties],optional:file:./.env[.properties]

